# The mirror updater only ever runs on a schedule against live data, so a
# broken index.mjs surfaces as a silently stale mirror. This runs the updater
# in dry-run mode on PRs: same code path, no writes to public/ and HEAD
# requests instead of downloading the multi-gigabyte payload.

name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Mirror dry run
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Update mirror (dry run)
        run: node index.mjs --dry-run
        env:
          # Only for the rate limit — the releases API is public, but the
          # anonymous budget is shared across every runner on this IP.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
